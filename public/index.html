<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q162-192LB4 Hydraulic Schematic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #006633;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: white;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #e0e0e0;
    }

    .subtitle {
      font-size: 12px;
      color: #8a8a9a;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #1a4a7a;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    button:hover {
      background: #1a4a7a;
    }

    button.active {
      background: #006633;
      border-color: #008844;
    }

    .zoom-display {
      font-size: 13px;
      color: #8a8a9a;
      min-width: 50px;
      text-align: center;
    }

    .viewer {
      flex: 1;
      overflow: auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .svg-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      transform-origin: center center;
      transition: transform 0.15s ease;
      cursor: grab;
      max-width: 100%;
    }

    .svg-container:active {
      cursor: grabbing;
    }

    .svg-container object {
      display: block;
      width: 1800px;
      height: 1200px;
    }

    footer {
      background: #16213e;
      border-top: 1px solid #0f3460;
      padding: 12px 24px;
      text-align: center;
      font-size: 12px;
      color: #6a6a7a;
    }

    footer a {
      color: #4a9a6a;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">Q</div>
      <div>
        <h1>Q162-192LB4 Hydraulic Schematic</h1>
        <div class="subtitle">Multiple heat pumps, heating &amp; DHW, thermal store with DHW coils</div>
      </div>
    </div>
    <div class="controls">
      <button id="zoomOut" title="Zoom out">-</button>
      <span class="zoom-display" id="zoomLevel">100%</span>
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="fitBtn" title="Fit to screen">Fit</button>
      <button id="fullBtn" title="Full size">1:1</button>
      <button id="downloadBtn" title="Download SVG">Download</button>
    </div>
  </header>

  <div class="viewer" id="viewer">
    <div class="svg-container" id="svgContainer">
      <object data="/Q-162-192-LB4-8-204.svg" type="image/svg+xml" id="svgObject">
        Your browser does not support SVG
      </object>
    </div>
  </div>

  <footer>
    Drawing Q-162-192-LB4-8-204 | Page 51 |
    <a href="https://www.qvantum.com" target="_blank" rel="noopener">Qvantum Energi AB</a>
  </footer>

  <script>
    const container = document.getElementById("svgContainer");
    const viewer = document.getElementById("viewer");
    const zoomDisplay = document.getElementById("zoomLevel");

    let scale = 1;
    let isPanning = false;
    let startX, startY, scrollLeft, scrollTop;

    function setZoom(newScale) {
      scale = Math.min(3, Math.max(0.2, newScale));
      container.style.transform = `scale(${scale})`;
      zoomDisplay.textContent = `${Math.round(scale * 100)}%`;
    }

    function fitToScreen() {
      const vw = viewer.clientWidth - 48;
      const vh = viewer.clientHeight - 48;
      const fitScale = Math.min(vw / 1800, vh / 1200);
      setZoom(fitScale);
    }

    document.getElementById("zoomIn").addEventListener("click", () => setZoom(scale + 0.1));
    document.getElementById("zoomOut").addEventListener("click", () => setZoom(scale - 0.1));
    document.getElementById("fitBtn").addEventListener("click", fitToScreen);
    document.getElementById("fullBtn").addEventListener("click", () => setZoom(1));

    document.getElementById("downloadBtn").addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = "/Q-162-192-LB4-8-204.svg";
      a.download = "Q-162-192-LB4-8-204.svg";
      a.click();
    });

    viewer.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.05 : 0.05;
      setZoom(scale + delta);
    }, { passive: false });

    viewer.addEventListener("mousedown", (e) => {
      isPanning = true;
      startX = e.pageX - viewer.offsetLeft;
      startY = e.pageY - viewer.offsetTop;
      scrollLeft = viewer.scrollLeft;
      scrollTop = viewer.scrollTop;
    });

    viewer.addEventListener("mousemove", (e) => {
      if (!isPanning) return;
      e.preventDefault();
      const x = e.pageX - viewer.offsetLeft;
      const y = e.pageY - viewer.offsetTop;
      viewer.scrollLeft = scrollLeft - (x - startX);
      viewer.scrollTop = scrollTop - (y - startY);
    });

    document.addEventListener("mouseup", () => { isPanning = false; });

    window.addEventListener("load", fitToScreen);
    window.addEventListener("resize", fitToScreen);
  </script>
</body>
</html>
